[project]
name = "daily-combo-trials"
version = "0.1.0"
description = "A daily fighting-game combo trial challenge site built with FastAPI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app:app"
