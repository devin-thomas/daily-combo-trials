<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Daily Combo Trials{% endblock %}</title>
    <meta name="description" content="A daily combo trial challenge for fighting game practice.">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}" aria-label="Daily Combo Trials home">
          <span class="brand-top">DAILY</span>
          <span class="brand-bottom">COMBO TRIALS</span>
        </a>
        {% if request.url.path != '/setup' %}
          <nav class="site-nav" aria-label="Primary navigation">
            <a href="{{ url_for('home') }}">Today</a>
            <a href="{{ url_for('history') }}">History</a>
            <a href="{{ url_for('games') }}">Games</a>
          </nav>
        {% endif %}
      </header>

      <main id="main-content">
        {% block content %}{% endblock %}
      </main>

      {% if request.url.path != '/setup' and request.app.state.setup_enabled %}
        <footer class="site-footer">
          <a href="{{ url_for('setup') }}">Private setup</a>
        </footer>
      {% endif %}
    </div>
  </body>
</html>
